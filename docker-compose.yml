services:
  db:
    image: postgres:18-alpine
    container_name: spring_monolith_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-spring_monolith}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - spring-network

  redis:
    image: redis:alpine
    container_name: spring_monolith_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli --pass "$$REDIS_PASSWORD" ping; else redis-cli ping; fi']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - spring-network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: spring_monolith_app
    restart: unless-stopped
    environment:
      APP_ENV: development
      SPRING_PROFILES_ACTIVE: development
      API_PREFIX: /api/v1
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-spring_monolith}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-spring_monolith}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PORT: ${PORT:-3000}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:${PORT:-3000}/health/live | grep -q ok || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    networks:
      - spring-network

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: "no"
    command: ["mvn", "-q", "flyway:migrate"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-spring_monolith}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spring-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: spring_monolith_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - spring-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  spring-network:
    driver: bridge
