services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-spring_monolith}
    volumes: !override
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spring-network
    ports: !reset []

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes: !override
      - redis_data:/data
    networks:
      - spring-network
    ports: !reset []

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: production
      SPRING_PROFILES_ACTIVE: production
      PORT: ${PORT:-3000}
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-spring_monolith}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
    depends_on: !override
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: !reset []
    volumes: !reset []
    networks:
      - spring-network

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - spring-network

  migrate: !reset null
  pgadmin: !reset null

volumes:
  postgres_data:
  redis_data:

networks:
  spring-network:
    driver: bridge
