name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spring_monolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Lint (checkstyle + spotless)
        run: mvn -B checkstyle:check spotless:check
      - name: Build
        run: mvn -B package -DskipTests
      - name: Tests + Coverage
        run: mvn -B verify -Pcoverage
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/spring_monolith_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: spring_monolith_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco
          retention-days: 7
