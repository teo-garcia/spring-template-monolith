name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spring_monolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.4"
          cache: maven
      - name: Record Java runtime
        run: java -version
      - name: Check
        run: make check
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/spring_monolith_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: spring_monolith_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      - name: Build
        run: make build
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco
          retention-days: 7

      - name: Migrate conformance database
        run: make db-deploy
        env:
          DATABASE_PASSWORD: postgres
          DATABASE_URL: jdbc:postgresql://localhost:5432/spring_monolith_test
          DATABASE_USER: postgres

      - name: Start conformance server
        env:
          APP_ENV: test
          DATABASE_PASSWORD: postgres
          DATABASE_URL: jdbc:postgresql://localhost:5432/spring_monolith_test
          DATABASE_USER: postgres
          METRICS_ENABLED: "true"
          OTEL_ENABLED: "false"
          PORT: "43118"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          SPRING_PROFILES_ACTIVE: development
          THROTTLE_LIMIT: "1000"
        run: |
          java --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow -jar target/spring-template-monolith-0.0.0.jar > "$RUNNER_TEMP/backend-conformance.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend-conformance.pid"

      - name: Shared backend conformance
        uses: teo-garcia/templates/conformance/backend@da8df26c4c9a9f0299d227be6164898301e1888f
        with:
          base_url: http://127.0.0.1:43118

      - name: Upload conformance log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-conformance-log
          path: ${{ runner.temp }}/backend-conformance.log
          retention-days: 7

      - name: Stop conformance server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend-conformance.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend-conformance.pid")" 2>/dev/null || true
          fi
