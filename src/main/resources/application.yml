server:
  port: ${PORT:3000}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  main:
    banner-mode: off
  application:
    name: ${APP_NAME:spring-template-monolith}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:10s}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/spring_monolith}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC
  flyway:
    enabled: false
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
      repositories:
        enabled: false

app:
  env: ${APP_ENV:development}
  api-prefix: ${API_PREFIX:/api/v1}
  version: ${API_VERSION:1}
  shutdown-timeout: ${SHUTDOWN_TIMEOUT:10s}
  docs-enabled: ${DOCS_ENABLED:true}
  openapi-server-url: ${OPENAPI_SERVER_URL:http://localhost:${PORT:3000}}
  cors-enabled: ${CORS_ENABLED:true}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  throttle-ttl: ${THROTTLE_TTL:60}
  throttle-limit: ${THROTTLE_LIMIT:100}
  metrics-enabled: ${METRICS_ENABLED:true}
  log-level: ${LOG_LEVEL:info}
  otel-service-name: ${OTEL_SERVICE_NAME:spring-template-monolith}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${app.otel-service-name}
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    enabled: ${OTEL_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:true}
    path: /openapi.json
  swagger-ui:
    enabled: ${DOCS_ENABLED:true}
    path: /docs
    operationsSorter: method

logging:
  level:
    root: WARN
    com.teogarcia.springmonolith: ${LOG_LEVEL:INFO}
