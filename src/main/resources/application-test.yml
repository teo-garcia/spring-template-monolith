server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  env: test
  cors-enabled: false
  throttle-limit: 1000
  metrics-enabled: true
  docs-enabled: true

management:
  opentelemetry:
    enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /actuator

logging:
  level:
    root: WARN
    com.teogarcia.springmonolith: WARN
